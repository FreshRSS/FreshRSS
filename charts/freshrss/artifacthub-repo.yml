# Artifact Hub repository metadata file.
#
# This file must be served at the root of the Helm repository (the same
# location as index.yaml, i.e. the gh-pages root once chart-releaser publishes).
# See https://artifacthub.io/docs/topics/repositories/
#
# repositoryID is issued by Artifact Hub after adding the repository there.
# It is required to become a verified publisher. Fill it in and uncomment.
# repositoryID: 00000000-0000-0000-0000-000000000000

# owners is used to claim repository ownership. Fill in real name/email.
# owners:
#   - name: XtremeOwnageDotCom
#     email: you@example.com
