image:
  repository: freshrss/freshrss
  tag: "1.29.1"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podLabels: {}

imagePullSecrets: []
  # - name: my-registry-secret

freshrss:
  CRON_MIN: "*/15"
  ADMIN_EMAIL: ""

extraEnv: []
  # - name: TZ
  #   value: "Europe/Paris"
  # - name: TRUSTED_PROXY
  #   value: "10.0.0.0/8"

extraEnvFrom: []
  # - configMapRef:
  #     name: my-extra-config
  # - secretRef:
  #     name: my-extra-secret

oidc:
  enabled: false
  providerMetadataUrl: ""
  remoteUserClaim: preferred_username
  clientId: ""
  scopes: "openid profile"
  xForwardedHeaders: "X-Forwarded-Host X-Forwarded-Port X-Forwarded-Proto"
  secrets:
    clientSecret: ""
    clientCryptoKey: ""

# Use an existing Secret (containing OIDC_CLIENT_SECRET / OIDC_CLIENT_CRYPTO_KEY)
# instead of one generated by the chart.
existingSecret: ""

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

ingress:
  enabled: true
  className: ""
  annotations: {}
  host: "freshrsstest.kube.xtremeownage.com"
  path: "/"
  tls: []
    # - secretName: freshrss-tls
    #   hosts:
    #     - freshrsstest.kube.xtremeownage.com

httpRoute:
  enabled: false
  annotations: {}
  parentRefs: []
    # - name: my-gateway
    #   namespace: gateway-system
    #   sectionName: https
  hostnames: []
    # - freshrss.example.com
  matches:
    - path:
        type: PathPrefix
        value: /

persistence:
  enabled: true
  # storageClass: "-"
  accessMode: ReadWriteOnce
  size: "5Gi"
  # Use a pre-existing PVC instead of one generated by the chart.
  existingClaim: ""

resources: {}

podSecurityContext: {}
  # fsGroup: 33

securityContext: {}
  # runAsNonRoot: true
  # readOnlyRootFilesystem: false
  # capabilities:
  #   drop:
  #     - ALL

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}