name: Trigger actions on PR comments

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  fix-all:
    if: |
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/fix-all' &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        (github.event.comment.user != null && github.event.comment.user.login == github.event.issue.user.login)
      )
    runs-on: ubuntu-latest

    steps:
      - name: Post acknowledgment comment
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 Command `/fix-all` received. Running…'
            });

      - name: Get PR details and security
        uses: actions/github-script@v8
        id: pr
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            if (pr.data.state !== 'open') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Command `/fix-all` can only be run on open pull requests.'
              });
              core.setFailed('PR is not open');
              return;
            }

            // Security: Only allow pushing to PRs targeting this repository
            const baseRepo = pr.data.base.repo.full_name;
            const headRepo = pr.data.head.repo.full_name;
            const headRef = pr.data.head.ref;
            const expectedRepo = context.repo.owner + '/' + context.repo.repo;

            // Ensure the PR targets the correct base repository
            if (baseRepo !== expectedRepo) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Security: PR must target this repository.'
              });
              core.setFailed('PR targets wrong repository');
              return;
            }

            // Security: Ensure we only push to allowed repositories
            // - Same repository: when PR is from a branch (not a fork)
            // - Fork repository: when PR is from a fork with "Allow edits by maintainers" enabled
            // We should NEVER push to unrelated third-party repositories

            // Additional validation: maintainer_can_modify must be true for forks
            if (headRepo !== expectedRepo && !pr.data.maintainer_can_modify) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Cannot push changes: PR settings must have "Allow edits and access to secrets by maintainers" enabled.'
              });
              core.setFailed('Maintainer edits not allowed');
              return;
            }

            // Security: Validate branch name to prevent injection
            if (!/^[a-zA-Z0-9/_.-]+$/.test(headRef)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '⚠️ Security: Invalid branch name.'
              });
              core.setFailed('Invalid branch name');
              return;
            }

            return {
              headRepo: headRepo,
              headRef: headRef
            };

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: ${{ fromJSON(steps.pr.outputs.result).headRepo }}
          ref: ${{ fromJSON(steps.pr.outputs.result).headRef }}
          persist-credentials: false

      - name: Use Composer cache
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Run Composer install
        run: composer install --prefer-dist --no-progress
        if: steps.composer-cache.outputs.cache-hit != 'true'

      - name: Uses Node.js
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Run make fix-all
        id: fix
        run: |
          set -e
          if ! make fix-all; then
            echo "make_failed=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "make_failed=false" >> $GITHUB_OUTPUT

      - name: Check for changes and create commit
        id: commit
        if: success()
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "No changes to commit."
          else
            echo "no_changes=false" >> $GITHUB_OUTPUT

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            # Create commit
            git commit -m "chore: make fix-all"
            COMMIT_SHA=$(git rev-parse HEAD)
            echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Push changes
        if: success() && steps.commit.outputs.no_changes != 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const headRepo = ${{ steps.pr.outputs.result }}.headRepo;
            const headRef = ${{ steps.pr.outputs.result }}.headRef;
            const commitSha = '${{ steps.commit.outputs.commit_sha }}';

            // Security: Verify we're only pushing to the expected branch
            const currentBranch = require('child_process')
              .execSync('git rev-parse --abbrev-ref HEAD')
              .toString()
              .trim();

            if (currentBranch !== headRef) {
              core.setFailed(`Branch mismatch: expected ${headRef}, got ${currentBranch}`);
              return;
            }

            try {
              // Use secure GitHub API to push instead of git push with token
              await github.rest.git.updateRef({
                owner: headRepo.split('/')[0],
                repo: headRepo.split('/')[1],
                ref: `heads/${headRef}`,
                sha: commitSha,
                force: false
              });

              core.setOutput('pushed', 'true');
              console.log(`Successfully pushed to ${headRepo}:${headRef}`);
            } catch (error) {
              core.setOutput('pushed', 'false');
              core.setFailed(`Failed to push: ${error.message}`);
            }

      - name: Post completion comment
        uses: actions/github-script@v8
        if: always()
        with:
          script: |
            const makeFailed = ${{ steps.fix.outputs.make_failed == 'true' }};
            const noChanges = ${{ steps.commit.outputs.no_changes == 'true' }};
            const pushed = ${{ steps.commit.outputs.pushed == 'true' }};
            const commitSha = ${{ toJSON(steps.commit.outputs.commit_sha) }};
            const jobStatus = '${{ job.status }}';

            let message;
            if (jobStatus === 'success') {
              if (noChanges) {
                message = '✅ Command `/fix-all` completed with no change.';
              } else if (pushed) {
                message = `🔧 Command \`/fix-all\` made some fixes and committed as ${commitSha}`;
              } else {
                // Should not happen
                message = 'ℹ️ Command `/fix-all` completed, but strangely.';
              }
            } else if (makeFailed) {
              message = `❌ Command \`/fix-all\` failed. Check the [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.`;
            } else {
              message = `⚠️ Command \`/fix-all\` ran successfully, but changes could not be pushed.\n\n`;
              message += `* Please check that your PR settings “Allow edits from maintainers” is enabled.\n`;
              message += `* Or run \`make fix-all\` locally and push to your branch.`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
