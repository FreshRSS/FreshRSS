# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      eslint:
        patterns:
          - "*eslint*"
          - "globals"
          - "neostandard"
      stylelint:
        patterns:
          - "*stylelint*"
      npm-other:
        patterns:
          - '*'
        exclude-patterns:
          - "*eslint*"
          - "globals"
          - "neostandard"
          - "*stylelint*"
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      composer-root:
        patterns:
          - '*'
  - package-ecosystem: "composer"
    directory: "/lib/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      composer-lib:
        patterns:
          - '*'
  - package-ecosystem: "bundler"
    directory: "/docs/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      bundler:
        patterns:
          - '*'
