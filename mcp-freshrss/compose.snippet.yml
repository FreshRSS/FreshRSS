# Acrescente este serviço ao /root/freshrss-stack/compose.yml
#
# Nota: NÃO há mapeamento de portas. O serviço é alcançável apenas pela rede
# interna do Docker — pelo cloudflared e pelo próprio FreshRSS. Publicar a
# porta no host exporia um servidor MCP sem autenticação à internet.

  mcp-freshrss:
    build: ./mcp-freshrss
    container_name: mcp-freshrss
    restart: unless-stopped
    env_file:
      - ./mcp-freshrss/.env
    networks:
      - default
    depends_on:
      - freshrss-local

